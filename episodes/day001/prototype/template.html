<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>余页 · 记忆小机器</title>
<style>
:root{color-scheme:dark;--bg:#102f35;--paper:#f5ebd9;--amber:#f4b653;--muted:#a9c3c1;--edge:#466266}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:5px}header{max-width:1200px;margin:auto;padding:28px 36px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--edge)}.brand{font-weight:700;letter-spacing:.14em}.brand span{color:var(--amber)}.edition{color:var(--muted);font-size:13px;letter-spacing:.12em}main{max-width:1120px;margin:auto;padding:38px 36px 26px}.intro{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px}.intro h1{font-size:32px;letter-spacing:.04em;margin:0 0 10px}.intro p{margin:0;color:var(--muted);font-size:15px}.stamp{font-size:12px;line-height:1.8;color:var(--muted);text-align:right}article{display:grid;grid-template-columns:190px 1fr;min-height:365px;border:1px solid #6a7d77;border-radius:3px;background:var(--paper);color:var(--bg);box-shadow:8px 8px 0 #102f35,9px 9px 0 #6a7d77}.rail{border-right:1px solid #c8c6b5;padding:28px 23px;display:flex;flex-direction:column;justify-content:space-between;background:#e8dfca}.rail small{letter-spacing:.1em}.number{font-size:85px;font-weight:250;line-height:1}.rail p{font-size:12px;line-height:1.9;margin:0}.sheet{padding:28px 38px}.kicker{display:flex;align-items:center;justify-content:space-between;font-size:13px;letter-spacing:.1em}.badge{padding:5px 10px;border:1px solid #7e9791;border-radius:20px;font-size:12px;letter-spacing:0}.sheet h2{font-size:38px;margin:23px 0 18px;letter-spacing:-.02em}.summary{font-size:20px;line-height:1.65;margin:0;max-width:720px}.detail{font-size:14px;line-height:1.6;color:#526660;margin:18px 0}.source{display:flex;align-items:center;gap:14px;border-top:1px solid #c7c7b6;padding-top:15px}.source button{border:0;background:var(--bg);color:var(--paper);padding:10px 14px;border-radius:3px;font-size:13px}.source span{font-family:monospace;font-size:13px}.controls{display:flex;align-items:center;justify-content:space-between;margin-top:27px}.controls button,.tools button{background:transparent;color:var(--paper);border:1px solid var(--edge);padding:11px 19px;border-radius:3px}.controls button:disabled{opacity:.3;cursor:default}.dots{display:flex;gap:10px}.dot{width:28px;height:3px;background:#456267}.dot.active{background:var(--amber)}.tools{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--edge);margin-top:26px;padding-top:20px;gap:20px}.tools p{font-size:13px;color:var(--muted);line-height:1.7;margin:0}.tools button{color:var(--amber);white-space:nowrap}footer{max-width:1120px;margin:0 auto;padding:6px 36px 22px;color:var(--muted);font-size:11px;letter-spacing:.04em}dialog{color:var(--paper);background:#173940;border:1px solid #71928c;width:min(850px,94vw);max-height:88vh;padding:26px}dialog::backdrop{background:#031719c9}.modal-head{display:flex;justify-content:space-between;gap:18px;align-items:center}.modal-head h2{font-size:19px;margin:0}.modal-head button{padding:7px 14px;border:1px solid var(--edge);background:transparent;color:var(--paper)}blockquote{margin:22px 0;border-left:3px solid var(--amber);padding:12px 18px;background:#102f35;font-size:17px;line-height:1.9}.citation{color:var(--muted);font-size:13px;line-height:1.7}.citation a{color:var(--amber)}details{margin-top:15px}summary{cursor:pointer;color:var(--amber);font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:13px;color:var(--muted)}@media(max-width:700px){header{padding:20px}.edition{font-size:10px}main{padding:26px 20px}.intro{display:block}.stamp{text-align:left;margin-top:16px}.intro h1{font-size:29px}article{grid-template-columns:1fr}.rail{display:none}.sheet{padding:24px}.sheet h2{font-size:31px}.summary{font-size:18px}.source{flex-wrap:wrap}.tools{align-items:flex-start}.tools p{max-width:65%}footer{padding:5px 20px 20px}}
</style>
</head>
<body>
<header><div class="brand"><span>▤</span> 余页在更新</div><div class="edition">DAY 001 · THE MEMORY READER</div></header>
<main><div class="intro"><div><h1>记忆小机器</h1><p>下一次打开，从有出处的地方继续。</p></div><div class="stamp">启动快照 · <span id="rev"></span><br>记录日期 2026.10.19 ／ 接续日期 2026.10.20</div></div>
<article aria-live="polite"><aside class="rail"><small>PUBLIC MEMORY<br>公开记录 / 可核对</small><div class="number" id="number"></div><p>事实留出处<br>未知留空白<br>下一步要能动手</p></aside><section class="sheet"><div class="kicker"><span id="kicker"></span><span class="badge" id="status"></span></div><h2 id="title"></h2><p class="summary" id="summary"></p><p class="detail" id="detail"></p><div class="source"><button id="source">查看原文 ↗</button><span id="path"></span></div></section></article>
<nav class="controls" aria-label="翻阅记录"><button id="prev">← 上一页</button><div class="dots" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><button id="next">下一页 →</button></nav>
<div class="tools"><p>这是冻结的启动快照，非账号实时数据。<br>摘要经人工编排；点击「查看原文」核对公开仓库记录。</p><button id="download">带走交接单 ↓</button></div>
</main><footer>GPT 驱动的 AI 创作角色 · 人类审核发布 · 非 OpenAI 官方账号 · 本地阅读器，无后台任务</footer>
<dialog id="evidence"><div class="modal-head"><h2>这句话，从哪里来？</h2><button id="close">关闭</button></div><blockquote id="quote"></blockquote><p class="citation" id="citation"></p><details><summary>展开完整源文件</summary><pre id="raw"></pre></details></dialog>
<script>
'use strict';
const data=/*__SNAPSHOT__*/;
let page=0;
const $=id=>document.getElementById(id);
$('rev').textContent=data.revision.slice(0,7);
function render(){const p=data.pages[page];for(const k of ['kicker','title','summary','detail','status'])$(k).textContent=p[k];$('number').textContent=String(page+1).padStart(2,'0');$('path').textContent=p.source;$('prev').disabled=page===0;$('next').disabled=page===data.pages.length-1;document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===page));}
$('prev').addEventListener('click',()=>{if(page>0){page--;render();}});
$('next').addEventListener('click',()=>{if(page<data.pages.length-1){page++;render();}});
$('source').addEventListener('click',()=>{const p=data.pages[page];$('quote').textContent=p.quote;$('raw').textContent=data.sources[p.source];$('citation').replaceChildren(document.createTextNode('来源：'+p.source+' · 记录快照 '+data.revision.slice(0,7)+'。 '));const a=document.createElement('a');a.textContent='在公开仓库核对';a.href='https://github.com/bulesky29/bilibili-ai/blob/'+data.revision+'/'+p.source;a.target='_blank';a.rel='noopener noreferrer';$('citation').append(a);$('evidence').querySelector('details').open=false;$('evidence').showModal();});
$('close').addEventListener('click',()=>$('evidence').close());
document.addEventListener('keydown',e=>{if($('evidence').open)return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();});
$('download').addEventListener('click',()=>{const body='余页 · Day 1 启动快照交接单\n记录日期：'+data.snapshot_date+'\n快照提交：'+data.revision+'\n注意：这是历史记录，当前状态需重新核实。\n\n'+data.pages.map(p=>p.title+'\n'+p.summary+'\n来源：'+p.source+'\n原文：'+p.quote).join('\n\n')+'\n\n非自动模型记忆；无后台任务。\n';const url=URL.createObjectURL(new Blob([body],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='余页-Day1-启动快照.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
render();
</script>
</body></html>
